title: KH1 Modern Camera (1.0.0)
originalAuthor: Mariano
description: >-
  Makes the KH1 camera feel like a modern game: responsive right-stick turning
  with no inertia and no automatic re-centering. Speed and sensitivity are
  configurable. Works with lock-on camera mods like KH2 Style Camera. Don't use
  with CameraSpeedSlider. Steam version only.
